name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'        # weekly: image drift, FC-09
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Three stages (plan section 10):
#   1. lint                         static checks, no compiler run
#   2. coverage, sanitize, no-heap  gates on the reference image (ubuntu:26.04 = devcontainer)
#   3. host, qemu, bare, lto, fetch the matrix; starts only when every gate is green
# ci-ok is the single required check.
jobs:
  # ---------------------------------------------------------------- stage 1
  lint:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: install
        run: scripts/ci/apt_install.sh clang-format shellcheck
      - name: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: find src test examples -name '*.[ch]' -print0 | xargs -0 clang-format --dry-run --Werror
      - name: shellcheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: shellcheck -x scripts/*.sh scripts/ci/*.sh
      - name: no-heap grep (NH-03)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/check_no_heap.sh --grep-only

  # ---------------------------------------------------------------- stage 2: gates
  # coverage (GCC, -O0) and sanitize (GCC and Clang) build and run the full test suite of the six
  # coverage-gated configurations, so they are also the reference Debug runs of CC-01.
  coverage:
    needs: lint
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: install
        run: scripts/ci/apt_install.sh build-essential cmake ninja-build gcovr
      - { name: default,  if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/coverage.sh default }
      - { name: debug,    if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/coverage.sh debug }
      - { name: nochecks, if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/coverage.sh nochecks }
      - { name: wide,     if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/coverage.sh wide }
      - { name: noalign,  if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/coverage.sh noalign }
      - { name: bigalign, if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/coverage.sh bigalign }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with: { name: coverage-html, path: build/coverage/ }

  sanitize:
    name: sanitize / ${{ matrix.cc }}
    needs: lint
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - id: install
        run: scripts/ci/apt_install.sh build-essential clang libclang-rt-dev cmake ninja-build
      - { name: default,  if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: 'scripts/sanitize.sh --cc "$CC" default' }
      - { name: debug,    if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: 'scripts/sanitize.sh --cc "$CC" debug' }
      - { name: nochecks, if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: 'scripts/sanitize.sh --cc "$CC" nochecks' }
      - { name: wide,     if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: 'scripts/sanitize.sh --cc "$CC" wide' }
      - { name: noalign,  if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: 'scripts/sanitize.sh --cc "$CC" noalign' }
      - { name: bigalign, if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: 'scripts/sanitize.sh --cc "$CC" bigalign' }
      - name: pthread (TSan)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.cc == 'clang' }}
        run: scripts/sanitize.sh --cc clang --tsan pthread

  no-heap:
    needs: lint
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/apt_install.sh build-essential clang cmake ninja-build
      - run: scripts/check_no_heap.sh

  # ---------------------------------------------------------------- stage 3: matrix
  host:
    name: host / ${{ matrix.id }}
    needs: [coverage, sanitize, no-heap]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Reference compilers: Debug of the six coverage-gated configurations already ran in
          # coverage and sanitize; here only what those gates do not build.
          - { id: gcc-15,     image: 'ubuntu:26.04', cc: gcc,   configs: 'pthread', packages: 'build-essential cmake ninja-build' }
          - { id: clang-21,   image: 'ubuntu:26.04', cc: clang, configs: 'pthread', packages: 'clang lld cmake ninja-build' }
          # Older compilers and the 32-bit host: everything.
          - { id: gcc-13,     image: 'ubuntu:24.04', cc: gcc,   packages: 'build-essential cmake ninja-build' }
          - { id: clang-18,   image: 'ubuntu:24.04', cc: clang, packages: 'clang lld cmake ninja-build' }
          - { id: gcc-11,     image: 'ubuntu:22.04', cc: gcc,   packages: 'build-essential cmake ninja-build' }
          - { id: clang-14,   image: 'ubuntu:22.04', cc: clang, packages: 'clang lld cmake ninja-build' }
          - { id: gcc-15-m32, image: 'ubuntu:26.04', selector: host-gcc-m32, optconfigs: 'default', optbuildtypes: 'Release',
              packages: 'build-essential gcc-multilib cmake ninja-build' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/target
        with:
          selector: ${{ matrix.selector || 'host' }}
          cc: ${{ matrix.cc || '' }}
          packages: ${{ matrix.packages }}
          configs: ${{ matrix.configs || 'default debug nochecks wide noalign bigalign pthread' }}
          optconfigs: ${{ matrix.optconfigs || 'default debug nochecks' }}
          optbuildtypes: ${{ matrix.optbuildtypes || 'Release MinSizeRel' }}

  qemu:
    name: qemu / ${{ matrix.arch }}
    needs: [coverage, sanitize, no-heap]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, triple: aarch64-linux-gnu,   libc: arm64 }
          - { arch: armhf,   triple: arm-linux-gnueabihf, libc: armhf }
          - { arch: riscv64, triple: riscv64-linux-gnu,   libc: riscv64 }
          - { arch: powerpc, triple: powerpc-linux-gnu,   libc: powerpc }   # big-endian
          - { arch: s390x,   triple: s390x-linux-gnu,     libc: s390x }     # big-endian
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/target
        with:
          selector: ${{ matrix.arch }}
          packages: gcc-${{ matrix.triple }} libc6-dev-${{ matrix.libc }}-cross qemu-user cmake ninja-build
          optconfigs: 'default nochecks'
          optbuildtypes: 'MinSizeRel'
          symbols: 'true'

  bare:
    name: bare / ${{ matrix.family }}
    needs: [coverage, sanitize, no-heap]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: arm-gcc,   packages: 'gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi' }
          - { family: clang,     packages: 'clang lld llvm binutils-arm-none-eabi binutils-riscv64-unknown-elf libnewlib-arm-none-eabi picolibc-riscv64-unknown-elf' }
          - { family: riscv-gcc, packages: 'gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf' }
          - { family: avr-gcc,   packages: 'gcc-avr binutils-avr avr-libc' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/target
        with:
          selector: family:${{ matrix.family }}
          packages: ${{ matrix.packages }}
          configs: 'default debug nochecks wide noalign bigalign'
          size: 'true'

  lto:
    name: lto / ${{ matrix.cc }}
    needs: [coverage, sanitize, no-heap]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - id: install
        run: scripts/ci/apt_install.sh build-essential clang lld llvm cmake ninja-build
      - { name: default,  if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/ci/build_one.sh --lto host default Release }
      - { name: debug,    if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/ci/build_one.sh --lto host debug Release }
      - { name: nochecks, if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/ci/build_one.sh --lto host nochecks Release }

  fetch:
    needs: [coverage, sanitize, no-heap]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: install
        run: >-
          scripts/ci/apt_install.sh build-essential cmake ninja-build make python3-venv
          gcc-arm-none-eabi libnewlib-arm-none-eabi
      - { name: basic,         if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh basic }
      - { name: config-normal, if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh config-normal }
      - { name: config-cache,  if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh config-cache }
      - { name: mismatch,      if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh mismatch }
      - { name: cstd,          if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh cstd }
      - { name: generators,    if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh generators }
      - { name: cmake-floor,   if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh cmake-floor }
      - { name: baremetal,     if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh baremetal }
      - { name: docs,          if: "${{ !cancelled() && steps.install.outcome == 'success' }}", run: scripts/fetchcontent_smoke.sh docs }
      # FC-09 needs the pushed commit on GitHub, so it runs on pushes and on the weekly schedule only.
      - name: online (FC-09)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        run: scripts/fetchcontent_smoke.sh online
        env:
          BLOC_GIT_TAG: ${{ github.sha }}

  # ---------------------------------------------------------------- required check
  ci-ok:
    if: always()
    needs: [lint, coverage, sanitize, no-heap, host, qemu, bare, lto, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - run: echo "all jobs passed"
